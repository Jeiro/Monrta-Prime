<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B0E" />

    <!-- Theme bootstrap. Must run before first paint and before the React
         bundle loads, otherwise a light-mode user gets a full dark frame
         first — the flash is far more jarring than the ~0.3ms this costs.
         Kept inline and dependency-free for exactly that reason. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mp-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#F7F8FA" : "#0A0B0E");
        } catch (e) {
          /* Private mode / storage blocked — fall through to the dark default. */
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicon-512.png" />

    <!-- Fonts. Loaded here rather than via @import in index.css, which was
         render-blocking on every route. Instrument Serif is brand-only;
         Plex Sans carries the UI; Plex Mono carries figures (tabular). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <!-- Default SEO metadata. Per-route pages override these via useSeo();
         these values are the fallback (initial paint + non-JS crawlers). -->
    <title>Moneta Prime — Crypto Trading, Copy Trading & Investment Plans</title>
    <meta name="description" content="Moneta Prime is a crypto trading platform with real-time markets, tiered investment plans, and copy trading. Trade with precision and onboard in minutes." />
    <link rel="canonical" href="https://PLACEHOLDER-DOMAIN.example/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moneta Prime" />
    <meta property="og:title" content="Moneta Prime — Crypto Trading, Copy Trading & Investment Plans" />
    <meta property="og:description" content="Real-time markets, tiered investment plans, and copy trading in one workspace built for serious traders." />
    <meta property="og:url" content="https://PLACEHOLDER-DOMAIN.example/" />
    <meta property="og:image" content="https://PLACEHOLDER-DOMAIN.example/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moneta Prime — Crypto Trading, Copy Trading & Investment Plans" />
    <meta name="twitter:description" content="Real-time markets, tiered investment plans, and copy trading in one workspace built for serious traders." />
    <meta name="twitter:image" content="https://PLACEHOLDER-DOMAIN.example/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
